name: Build launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK (platform 34 + build-tools) preinstalled;
      # android-actions/setup-android@v3 currently fails installing the obsolete 'tools' package.

      - name: Build release APK (debug-signed, per app/build.gradle)
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Show APK
        run: ls -la launcher/app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
